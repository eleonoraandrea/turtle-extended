# ATPS — Adaptive Turtle Perpetual System (Go) — v2 VALIDATA (2026-09-04)
# Vinci optimizer v2 grid completa 2592 (train 2020-01→2024-09, test 2024-09→2026-09)
# Combo: atr1.8 donchian(don0.0) don10 pyr(off) sat0.40 r0.020 entry:close reentry:off dd(10/25)
# Validazione: reports/V4_VALIDATION.md (portfolio PROMOSSO) — baseline v2: report rimosso su richiesta 2026-09-04, in git history prima del commit 0729664
general:
  initial_capital: 10000.0
  interval: "4h"              # 1h, 4h, 1d
  symbols: ["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT","DOGEUSDT","LINKUSDT"]        # BTC-focused; ETH/SOL validati con questa config (report rimosso su richiesta 2026-09-04 — in git history prima del commit 0729664) — compare.symbols resta 3 per il confronto
  orderly_symbols: ["PERP_BTC_USDC","PERP_ETH_USDC","PERP_SOL_USDC","PERP_BNB_USDC","PERP_XRP_USDC","PERP_DOGE_USDC","PERP_LINK_USDC"]
  start_time: "2020-01-01"
  end_time: ""

costs:
  fee_bps: 4.0                 # 0.04% taker per side (conservativo perps)
  slippage_bps: 2.0
  funding_interval_hours: 8
  leverage: 5.0                # fallback legacy — il motore usa risk/leverage DINAMICO
  max_notional_per_trade: 75000

# ── RISK ENGINE — sizing per rischio max 2%, leva DINAMICA, base/min/max ──
# qty = (equity × risk%) / |entry − stop|  — posizione SCALA con equity (compounding)
# risk% adattivo v2: base 2.0% (= max, era 1.0%) → min 0.25% (high vol / DD); cap kelly 2%
risk:
  base: 0.02                  # 2.0% base (v2 optimizer: r0.020) — era 1.0%
  min: 0.0025                 # 0.25% min
  max: 0.02                   # 2.0% max per posizione (user requirement)
  max_risk_per_trade_pct: 2.0 # alias legacy
  max_portfolio_heat_pct: 3.0 # alias legacy = portfolio.max_open_risk 3%
  max_leverage: 5.0           # HARD cap (user spec leverage.max 5)
  min_leverage_cap: 0.7
  max_notional: 75000
  vol_target_pct: 50.0        # target vol ann. per adaptive_risk
  kelly_cap_pct: 2.0
  dd_deleverage_start_pct: 10.0
  dd_flat_pct: 25.0
  adx_soft_threshold: 15

# ── PORTFOLIO RISK ──
portfolio:
  max_portfolio_heat_pct: 3.0     # legacy alias
  max_open_risk: 0.03             # user spec: 3% max open risk
  max_correlated_risk: 0.02       # user spec: 2% max correlated
  max_corr_exposure: 2
  crash_brake_drop_pct: 8.0

# ── LEVERAGE (user spec) ──
leverage:
  max: 5

# ── TREND (user spec) ──
trend:
  donchian_entry: 55
  donchian_exit: 20

# ── ATR (user spec) ──
atr:
  period: 20
  initial_stop: 2.0

# ── PYRAMIDING (user spec) ──
pyramiding:
  enabled: false              # v2 optimizer: OFF (max_additions ignorato quando disabilitato)
  max_additions: 4
  risk_neutral: true          # ogni add non aumenta rischio totale oltre base

# ── PROFIT (user spec) ──
profit:
  trailing: true
  fixed_tp: false
  satellite:
    enabled: true
    allocation: 0.40          # 40% satellite per large winners +5R/+10R (v2 optimizer: sat0.4)

# ── REGIME (user spec) ──
regime:
  btc_filter: true            # filtro BTC trend
  adx_min: 20

# ── VOLATILITY / DRAWDOWN / FUNDING / OI FILTERS (user spec) ──
volatility:
  adaptive_risk: true
drawdown:
  adaptive_risk: true
funding:
  filter: false  # DISABILITATO su richiesta utente (19/08) — funding solo costo (fee), non blocca entry
open_interest:
  filter: true

# Backtest engine legacy (mantiene compatibilità)
backtest:
  pyramiding_max_units: 4
  pyramid_step_atr: 0.5
  trail_atr_mult: 2.5
  use_next_open_fill: true
  commission_model: "bps"

# Varianti — BIG IMPROVE: stop 1.8× tight, filtri meno restrittivi, volTarget 50%
variant_a: # ATPS v2 — vincitore optimizer grid completa 2592 (report rimosso su richiesta 2026-09-04 — in git history prima del commit 0729664)
  name: "Variant A — ATPS v4 portfolio BTC+ETH+SOL (risk 2% validato, vedi reports/V4_VALIDATION.md)"
  donchian_entry: 55          # user spec trend 55
  donchian_exit: 20
  donchian_alt: 20
  atr_period: 20
  atr_stop_mult: 1.6
  risk_pct: 2.0
  sma_filter: 300
  use_ema_filter: false
  trail_mode: donchian        # v3: uscita Donchian breve
  don_exit: 10                # v3: Donchian exit 10 barre
  entry_mode: close           # v2: entry a close barra (niente intrabar)
  reentry:                    # v2: re-entry post stop-out OFF
    enabled: false
    lookback: 10
    within_bars: 20

variant_b: # + regime filter
  name: "Variant B — Regime Filter (Improved)"
  donchian_entry: 55
  donchian_exit: 20
  donchian_alt: 20
  atr_period: 20
  atr_stop_mult: 1.8
  risk_pct: 1.8
  adx_period: 14
  adx_threshold: 20            # user spec adx_min 20
  ema_fast: 50
  ema_slow: 200
  vol_regime_lookback: 100
  vol_regime_low_pct: 20
  vol_regime_high_pct: 80

variant_c: # + derivatives
  name: "Variant C — Derivatives Filter (Improved)"
  donchian_entry: 55
  donchian_exit: 20
  atr_period: 20
  atr_stop_mult: 1.8
  risk_pct: 1.8
  adx_period: 14
  adx_threshold: 20
  ema_fast: 50
  ema_slow: 200
  funding_z_threshold: 2.8
  funding_z_lookback: 30
  oi_delta_threshold: 0.01
  volume_mult: 1.1
  volume_sma: 20

variant_d: # full adaptive — massimizza Expectancy×Skew×Compounding
  name: "Variant D — Full Adaptive ATPS (Improved, Satellite 30%)"
  donchian_fast: 20
  donchian_mid: 55
  donchian_slow: 100
  atr_period: 20
  atr_stop_mult: 1.8
  risk_pct: 1.5
  vol_target_pct: 50.0
  kelly_cap_pct: 2.0
  adx_period: 14
  adx_threshold: 15
  ema_fast: 50
  ema_slow: 200
  vol_regime_lookback: 100
  funding_z_threshold: 2.8
  funding_z_lookback: 30
  oi_delta_threshold: 0.005
  volume_mult: 1.1
  volume_sma: 20
  trail_atr_mult: 2.5
  trail_mode: "chandelier"
  use_crash_brake: true
  adaptive_channel: true

# Backtest compare
compare:
  variants: ["A","B","C","D"]
  symbols: ["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT","DOGEUSDT","LINKUSDT"]

# Walk-forward
walk_forward:
  folds: 8
  train_ratio: 0.7
  metric: "sharpe"
  anchored: false

# Monte Carlo
monte_carlo:
  runs: 2000
  perturbation_pct: 20.0
  block_bootstrap: true
  block_size: 20
  seed: 42

# Report
report:
  title_prefix: "ATPS Backtest"
  include_trades: true
  max_trades_in_table: 500
  theme: "dark"
  embed_lightweight_charts: true
  comparison_metrics: ["cagr","sharpe","sortino","calmar","max_dd","win_rate","profit_factor","funding_drag","exposure","expectancy","skew"]

# Data
data:
  binance_base: "https://fapi.binance.com"
  binance_vision_base: "https://data.binance.vision"
  cache_ttl_seconds: 300
  align_funding: true
  align_oi: true
  oi_period: "4h"

# Execution Orderly (isolato, mai importato da backtest)
orderly:
  mainnet: "https://api.orderly.org"
  testnet: "https://testnet-api.orderly.org"
  ws_mainnet: "wss://ws.orderly.org/ws"
  default_chain: "arbitrum"
  symbols_map:
    BTCUSDT: "PERP_BTC_USDC"
    ETHUSDT: "PERP_ETH_USDC"
    SOLUSDT: "PERP_SOL_USDC"
  leverage: 5
  slippage_bps: 5
